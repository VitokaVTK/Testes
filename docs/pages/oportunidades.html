<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CRM | Oportunidades</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="brand">
            CRM
        </div>

        <nav class="nav">

            <a href="../index.html">
                Dashboard
            </a>

            <a href="./clientes.html">
                Clientes
            </a>

            <a href="./contatos.html">
                Contatos
            </a>

            <a class="active" href="./oportunidades.html">
                Oportunidades
            </a>

            <a href="./tarefas.html">
                Tarefas
            </a>

        </nav>

    </aside>

    <main class="main">

        <header>

            <div>

                <h1>
                    Oportunidades
                </h1>

                <div class="subtitle">
                    Pipeline comercial
                </div>

            </div>

        </header>

        <section class="panel">

            <h2>
                Nova oportunidade
            </h2>

            <form id="oportunidadeForm">

                <div class="form-grid">

                    <div class="field">

                        <label>
                            Cliente
                        </label>

                        <select
                            name="clienteId"
                            id="clienteId"
                            required
                        ></select>

                    </div>

                    <div class="field">

                        <label>
                            Título
                        </label>

                        <input
                            type="text"
                            name="titulo"
                            required
                        >

                    </div>

                    <div class="field">

                        <label>
                            Valor
                        </label>

                        <input
                            type="number"
                            name="valor"
                            min="0"
                            step="0.01"
                            value="0"
                        >

                    </div>

                    <div class="field">

                        <label>
                            Etapa
                        </label>

                        <select name="etapa">

                            <option value="Novo">
                                Novo
                            </option>

                            <option value="Qualificação">
                                Qualificação
                            </option>

                            <option value="Proposta">
                                Proposta
                            </option>

                            <option value="Negociação">
                                Negociação
                            </option>

                            <option value="Ganho">
                                Ganho
                            </option>

                            <option value="Perdido">
                                Perdido
                            </option>

                        </select>

                    </div>

                </div>

                <div class="actions">

                    <button type="submit">
                        Criar oportunidade
                    </button>

                </div>

            </form>

        </section>

        <section class="panel">

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Cliente
                            </th>

                            <th>
                                Título
                            </th>

                            <th>
                                Valor
                            </th>

                            <th>
                                Etapa
                            </th>

                            <th>
                                Criação
                            </th>

                        </tr>

                    </thead>

                    <tbody id="oportunidadesTabela"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/oportunidades.js"></script>

</body>
</html>
