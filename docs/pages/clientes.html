<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CRM | Clientes</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="brand">
            CRM
        </div>

        <nav class="nav">

            <a href="../index.html">
                Dashboard
            </a>

            <a class="active" href="./clientes.html">
                Clientes
            </a>

            <a href="./contatos.html">
                Contatos
            </a>

            <a href="./oportunidades.html">
                Oportunidades
            </a>

            <a href="./tarefas.html">
                Tarefas
            </a>

        </nav>

    </aside>

    <main class="main">

        <header>

            <div>

                <h1>
                    Clientes
                </h1>

                <div class="subtitle">
                    Cadastro e gerenciamento de clientes
                </div>

            </div>

            <button id="btnNovo">
                Novo cliente
            </button>

        </header>

        <section id="formBox" class="panel hidden">

            <h2 id="formTitle">
                Novo cliente
            </h2>

            <form id="clienteForm">

                <div class="form-grid">

                    <div class="field">

                        <label>
                            Nome
                        </label>

                        <input
                            type="text"
                            name="nome"
                            required
                        >

                    </div>

                    <div class="field">

                        <label>
                            E-mail
                        </label>

                        <input
                            type="email"
                            name="email"
                        >

                    </div>

                    <div class="field">

                        <label>
                            Telefone
                        </label>

                        <input
                            type="text"
                            name="telefone"
                        >

                    </div>

                    <div class="field">

                        <label>
                            Empresa
                        </label>

                        <input
                            type="text"
                            name="empresa"
                        >

                    </div>

                    <div class="field">

                        <label>
                            Status
                        </label>

                        <select name="status">

                            <option value="Ativo">
                                Ativo
                            </option>

                            <option value="Inativo">
                                Inativo
                            </option>

                        </select>

                    </div>

                </div>

                <div class="actions">

                    <button type="submit">
                        Salvar
                    </button>

                    <button
                        type="button"
                        id="cancelar"
                        class="secondary"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <section class="panel">

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Empresa</th>
                            <th>Status</th>
                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="clientesTabela"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/clientes.js"></script>

</body>
</html>
