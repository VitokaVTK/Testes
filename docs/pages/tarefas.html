<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CRM | Tarefas</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="brand">
            CRM
        </div>

        <nav class="nav">

            <a href="../index.html">
                Dashboard
            </a>

            <a href="./clientes.html">
                Clientes
            </a>

            <a href="./contatos.html">
                Contatos
            </a>

            <a href="./oportunidades.html">
                Oportunidades
            </a>

            <a class="active" href="./tarefas.html">
                Tarefas
            </a>

        </nav>

    </aside>

    <main class="main">

        <header>

            <div>

                <h1>
                    Tarefas
                </h1>

                <div class="subtitle">
                    Atividades e acompanhamento
                </div>

            </div>

        </header>

        <section class="panel">

            <h2>
                Nova tarefa
            </h2>

            <form id="tarefaForm">

                <div class="form-grid">

                    <div class="field">

                        <label>
                            Cliente
                        </label>

                        <select
                            name="clienteId"
                            id="clienteId"
                        >

                            <option value="">
                                Sem cliente
                            </option>

                        </select>

                    </div>

                    <div class="field">

                        <label>
                            Título
                        </label>

                        <input
                            type="text"
                            name="titulo"
                            required
                        >

                    </div>

                    <div class="field full">

                        <label>
                            Descrição
                        </label>

                        <textarea
                            name="descricao"
                        ></textarea>

                    </div>

                    <div class="field">

                        <label>
                            Vencimento
                        </label>

                        <input
                            type="date"
                            name="vencimento"
                        >

                    </div>

                </div>

                <div class="actions">

                    <button type="submit">
                        Criar tarefa
                    </button>

                </div>

            </form>

        </section>

        <section class="panel">

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Cliente
                            </th>

                            <th>
                                Título
                            </th>

                            <th>
                                Descrição
                            </th>

                            <th>
                                Vencimento
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tarefasTabela"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/tarefas.js"></script>

</body>
</html>
